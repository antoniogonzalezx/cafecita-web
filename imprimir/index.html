<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- Lo de imprimir de cualquier bar: /imprimir/?bar=<bar> (ruta.js lee el bar). Usa los ficheros de la raíz. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob: https://cafecita-api.cafecita-api.workers.dev http://localhost:8787; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="robots" content="noindex" />
  <title>Para imprimir · cafecita</title>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="fonts/fonts.css?v=5" />
  <link rel="stylesheet" href="imprimir.css?v=5" />
</head>
<body data-ruta="pagina">
  <header class="p-bar">
    <a class="p-back" id="pBack" href="/carta/">← Gestión</a>
    <nav class="p-tabs" aria-label="Qué imprimir">
      <button type="button" class="p-tab" data-que="mesas" aria-pressed="false">Pegatinas para las mesas</button>
      <button type="button" class="p-tab" data-que="barra" aria-pressed="false">Cartel para la barra</button>
      <button type="button" class="p-tab" data-que="carta" aria-pressed="false">Carta en papel</button>
    </nav>
    <button type="button" class="p-print" id="pPrint">Imprimir o guardar en PDF</button>
  </header>
  <p class="p-hint" id="pHint"></p>
  <main class="p-sheets" id="pSheets" aria-live="polite"></main>

  <script src="ruta.js?v=1"></script>
  <script type="module" src="imprimir.js?v=7"></script>
</body>
</html>
