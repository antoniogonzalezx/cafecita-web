# Cada media hora junta los titulares de los periódicos en noticias.json y,
# si han cambiado, los sube a main (GitHub Pages publica la web desde main).
name: Noticias

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Leer los RSS
        run: python3 tools/build_news.py

      - name: Subir noticias.json
        id: push
        run: |
          git diff --quiet -- noticias.json && exit 0
          git config user.name "cafecita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # los push hechos con GITHUB_TOKEN no siempre disparan la publicación de Pages
      - name: Publicar en Pages
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
